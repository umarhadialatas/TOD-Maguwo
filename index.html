        };
        basemaps.light.addTo(map);
        
        function switchBasemap(id) {
            Object.values(basemaps).forEach(l => map.hasLayer(l) && map.removeLayer(l));
            basemaps[id].addTo(map);
            document.querySelectorAll('.basemap-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.basemap === id));
        }

        ]};
        
        // Data fungsi_bangunan dan penggunaan_lahan dari file yang diberikan - dimuat sebagai objek
        // Karena ukuran besar, kita akan inline secara parsial untuk demo, tetapi agar berfungsi, kita masukkan data dari file yang diberikan
        // Untuk kode final, kita cukup masukkan semua data GeoJSON yang sudah disediakan.
        // Berikut inisialisasi layer kosong terlebih dahulu, kemudian fetch secara internal? Tapi karena ini kode statis, kita embed data yang ada.
        // Karena sangat panjang, kita akan load dari variabel yang sudah didefinisikan (simulasi).
        // Catatan: Data fungsi_bangunan dan penggunaan_lahan diambil dari file yang diberikan user dan di-embed di sini (tapi karena panjang, kita ringkas representasinya)
        // Solusi: Kita buat fungsi load data eksternal? Tapi user minta template sama. Saya embed langsung data yang ada.
        
        // Karena keterbatasan ruang, saya gunakan data dummy untuk layer lainnya, tapi agar aplikasi berjalan, saya akan baca dari file geojson yang tersedia secara internal.
        // Untuk memenuhi permintaan, saya akan menggunakan data dari file yang diberikan user (fungsi_bangunan, penggunaan_lahan) secara inline pada script ini (sebagian kecil)
        // Namun agar tidak error, kita simpan data yang diberikan. Di sini saya inisialisasi layer dengan data yang sudah ada di file.
        
        // Berikut adalah deklarasi layer kosong yang nanti diisi dengan data dari file yang sudah diberikan (embed penuh)
        const fungsiBangunanGeoJSON = {"type":"FeatureCollection","features":[]}; // Data sebenarnya terlalu panjang, tapi kita akan load via fetch? 
        // Agar website berfungsi optimal, kita muat dari file eksternal (karena kode HTML statis, kita bisa fetch dari path yang sama). 
        // Karena semua file sudah diberikan, kita lakukan fetch untuk setiap layer.
        
        // Pendekatan: Fetch data dari file lokal (asumsi file berada di folder yang sama)
        // Tapi karena ini kode dalam satu file, kita akan menggunakan fetch untuk memuat data yang sudah disediakan user.
        // Ini membuat kode lebih bersih dan menghindari inline data besar.
        
        // ======================== LOAD DATA DAN BUILD LAYER ========================
        const layerConfigs = [
            { id: 'transportasi', name: 'Transportasi', url: 'TOD/transportasi.geojson', type: 'point', color: '#ff4444', visible: true, legend: 'Titik Transportasi' },
            { id: 'rute_bus', name: 'Rute Bus', url: 'TOD/rute_bus.geojson', type: 'line', color: '#3388ff', visible: true, legend: 'Jalur Bus Trans Jogja' },
            { id: 'fungsi_bangunan', name: 'Fungsi Bangunan', url: 'TOD/fungsi_bangunan.geojson', type: 'polygon', color: '#ffaa33', visible: true, legend: 'Bangunan (Perkantoran, Kesehatan, dll)' },
            { id: 'penggunaan_lahan', name: 'Penggunaan Lahan', url: 'TOD/penggunaan_lahan.geojson', type: 'polygon', color: '#33cc99', visible: true, legend: 'Jalan, Permukiman, Fasum, dll' }
        ];
        
        let layers = {};
        let labelsVisible = false; // label default mati
        let labelMarkers = [];
        
        // Fungsi generate warna untuk setiap kategori unik
        function getColorForProperty(value, type) {
            let hash = 0;
            if (!value) return '#cccccc';
            for (let i = 0; i < value.length; i++) hash = value.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash % 360)}, 60%, 55%)`;
        }
        
        // Fungsi style untuk polygon/lines
        function getStyle(feature, layerId) {
            if (layerId === 'rute_bus') return { color: '#3388ff', weight: 4, opacity: 0.8 };
            if (layerId === 'fungsi_bangunan') {
                const jenis = feature.properties?.Keterangan || 'Lainnya';
                return { color: getColorForProperty(jenis, 'bangunan'), weight: 2, fillColor: getColorForProperty(jenis, 'bangunan'), fillOpacity: 0.5 };
            }
            if (layerId === 'penggunaan_lahan') {
                const guna = feature.properties?.Guna_Lahan || 'Lainnya';
                return { color: getColorForProperty(guna, 'lahan'), weight: 1.5, fillColor: getColorForProperty(guna, 'lahan'), fillOpacity: 0.4 };
            }
            return { color: '#ff4444', weight: 3 };
        }
        
        // Fungsi popup
        function bindPopup(feature, layer, layerId) {
            let content = '<div style="min-width:200px;"><b>Detail Informasi</b><hr/>';
            if (layerId === 'transportasi') content += `<b>Jenis:</b> ${feature.properties?.Ket || '-'}<br/><b>Koordinat</b>`;
            else if (layerId === 'rute_bus') content += `<b>Nama Rute:</b> ${feature.properties?.Name || '-'}<br/><b>Deskripsi:</b> ${feature.properties?.descriptio || '-'}`;
            else if (layerId === 'fungsi_bangunan') content += `<b>Keterangan:</b> ${feature.properties?.Keterangan || '-'}<br/><b>Lantai:</b> ${feature.properties?.Lantai || '-'}`;
            else if (layerId === 'penggunaan_lahan') content += `<b>Fungsi:</b> ${feature.properties?.Fungsi || '-'}<br/><b>Guna Lahan:</b> ${feature.properties?.Guna_Lahan || '-'}`;
            content += '</div>';
            layer.bindPopup(content);
        }
        
        // Fungsi untuk label (jika diaktifkan) - label berdasarkan keterangan/fungsi utama
        function addLabel(feature, layer, layerId) {
            if (!labelsVisible) return;
            let labelText = '';
            if (layerId === 'fungsi_bangunan') labelText = feature.properties?.Keterangan || '';
            else if (layerId === 'penggunaan_lahan') labelText = feature.properties?.Guna_Lahan || '';
            else if (layerId === 'transportasi') labelText = feature.properties?.Ket || '';
            else if (layerId === 'rute_bus') labelText = feature.properties?.Name || '';
            if (!labelText) return;
            const center = layer.getBounds ? layer.getBounds().getCenter() : layer.getLatLng();
            const icon = L.divIcon({ className: 'custom-label', html: `<div style="background:rgba(0,0,0,0.7); color:white; padding:2px 6px; border-radius:4px; font-size:10px; white-space:nowrap;">${labelText.substring(0,30)}</div>`, iconSize: [60,20] });
            const marker = L.marker(center, { icon, interactive: false });
            labelMarkers.push(marker);
            map.addLayer(marker);
        }
        
        async function loadAllLayers() {
            for (let cfg of layerConfigs) {
                try {
                    const response = await fetch(cfg.url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    const layerGroup = L.geoJSON(data, {
                        style: (feature) => getStyle(feature, cfg.id),
                        onEachFeature: (feature, layer) => {
                            bindPopup(feature, layer, cfg.id);
                            layer.on('click', () => {
                                if (window.lastHighlight) map.removeLayer(window.lastHighlight);
                                const hl = L.geoJSON(feature.geometry, { style: { color: 'yellow', weight: 5, fillOpacity: 0.3 } });
                                window.lastHighlight = hl.addTo(map);
                                setTimeout(() => map.removeLayer(hl), 2000);
                            });
                            addLabel(feature, layer, cfg.id);
                        }
                    });
                    if (cfg.visible) layerGroup.addTo(map);
                    layers[cfg.id] = { group: layerGroup, visible: cfg.visible, config: cfg };
                } catch(e) { console.error(`Gagal load ${cfg.url}`, e); }
            }
            buildLegendFromLayers();
            document.getElementById('layerStatus').innerHTML = '<i class="fas fa-check-circle"></i> Semua layer berhasil dimuat. Klik fitur untuk detail.';
        }
        
        // Build legenda dari layer yang sudah dimuat
        function buildLegendFromLayers() {
            const legendDiv = document.getElementById('legendContainer');
            let html = '';
            for (let id in layers) {
                const cfg = layers[id].config;
                html += `<div class="legend-item"><div class="legend-color" style="background: ${cfg.color};"></div><div class="legend-text">${cfg.name}</div></div>`;
            }
            html += `<div class="legend-item"><div class="legend-color" style="background: yellow; border:2px solid orange;"></div><div class="legend-text">Fitur Terpilih (Highlight)</div></div>`;
            legendDiv.innerHTML = html;
        }
        
        // Toggle layer dan perbarui label
        function updateLabelVisibility() {
            labelMarkers.forEach(m => map.removeLayer(m));
            labelMarkers = [];
            for (let id in layers) {
                if (layers[id].visible && labelsVisible) {
                    layers[id].group.eachLayer(layer => {
                        if (layer.feature) addLabel(layer.feature, layer, id);
                    });
                }
            }
        }
        
        // Render UI layer control
        function renderLayerControls() {
            const container = document.getElementById('layerControlList');
            container.innerHTML = '';
            for (let id in layers) {
                const cfg = layers[id].config;
                const div = document.createElement('div');
                div.className = `layer-item ${layers[id].visible ? 'active' : ''}`;
                div.innerHTML = `<div class="layer-info"><div class="layer-icon"><i class="fas ${cfg.id === 'transportasi' ? 'fa-bus' : cfg.id === 'rute_bus' ? 'fa-route' : cfg.id === 'fungsi_bangunan' ? 'fa-building' : 'fa-map'}"></i></div><div class="layer-text"><div class="layer-name">${cfg.name}</div><div class="layer-count">Layer Geospasial</div></div></div><div class="toggle-switch ${layers[id].visible ? 'active' : ''}" data-layer="${id}"></div>`;
                container.appendChild(div);
                const toggle = div.querySelector('.toggle-switch');
                toggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const lid = toggle.dataset.layer;
                    if (layers[lid].visible) {
                        map.removeLayer(layers[lid].group);
                        layers[lid].visible = false;
                        toggle.classList.remove('active');
                        div.classList.remove('active');
                    } else {
                        map.addLayer(layers[lid].group);
                        layers[lid].visible = true;
                        toggle.classList.add('active');
                        div.classList.add('active');
                    }
                    updateLabelVisibility();
                });
            }
        }
        
        // Pencarian atribut (case-insensitive)
        function searchInLayers(query) {
            if (!query.trim()) return;
            const lowerQuery = query.toLowerCase();
            let found = false;
            for (let id in layers) {
                if (!layers[id].visible) continue;
                layers[id].group.eachLayer(layer => {
                    if (!layer.feature) return;
                    let match = false;
                    const props = layer.feature.properties;
                    if (props) {
                        for (let key in props) {
                            if (props[key] && props[key].toString().toLowerCase().includes(lowerQuery)) { match = true; break; }
                        }
                    }
                    if (match) {
                        found = true;
                        const bounds = layer.getBounds ? layer.getBounds() : L.latLngBounds([layer.getLatLng(), layer.getLatLng()]);
                        map.fitBounds(bounds, { padding: [30,30] });
                        layer.openPopup();
                        if (window.lastHL) map.removeLayer(window.lastHL);
                        const hlGeo = L.geoJSON(layer.feature.geometry, { style: { color: 'cyan', weight: 6, fillOpacity: 0.2 } });
                        window.lastHL = hlGeo.addTo(map);
                        setTimeout(() => map.removeLayer(hlGeo), 3000);
                        return; // stop after first found
                    }
                });
                if (found) break;
            }
            if (!found) alert(`Tidak ditemukan data dengan kata "${query}" pada layer yang aktif.`);
        }
        
        // Event listeners
        document.getElementById('globalLabelToggle').addEventListener('click', function() {
            labelsVisible = !labelsVisible;
            this.classList.toggle('active', labelsVisible);
            updateLabelVisibility();
        });
        document.getElementById('searchBtn').addEventListener('click', () => {
            const q = document.getElementById('searchInput').value;
            searchInLayers(q);
        });
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') searchInLayers(e.target.value); });
        
        loadAllLayers().then(() => renderLayerControls());
        
        // Override style untuk label
        const style = document.createElement('style');
        style.textContent = `.custom-label { pointer-events: none; } .leaflet-interactive:focus { outline: none; }`;
        document.head.appendChild(style);
    </script>
</body>
